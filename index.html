<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic — Radio Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Plexus Background -->
  <canvas id="plexus"></canvas>

  <div class="app">

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12a4 4 0 0 1 8 0"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
        </svg>
        <span>Sonic</span>
      </div>

      <ul class="nav-links">
        <li class="active"><a href="#discover">Discover</a></li>
        <li><a href="#favourites">Favourites</a></li>
        <li><a href="#countries">Countries</a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="content">

      <!-- Discover View -->
      <section id="discover" class="view active">
        <header class="view-header">
          <h1>Discover Stations</h1>
          <p class="subtitle">Stream radio from around the world</p>
        </header>

        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search stations by name, genre..." />
        </div>

        <div class="sort-controls">
          <label>Sort by:</label>
          <select id="sortBy">
            <option value="votes" selected>Popularity</option>
            <option value="name">Name (A–Z)</option>
            <option value="clickcount">Click Count</option>
          </select>
        </div>

        <div class="station-grid" id="stationGrid"></div>

        <button class="btn-load-more" id="loadMoreBtn">Load More Stations</button>
      </section>

      <!-- Favourites View -->
      <section id="favourites" class="view">
        <header class="view-header">
          <h1>Favourites</h1>
          <p class="subtitle">Your saved stations</p>
        </header>
        <div class="station-grid" id="favGrid"></div>
        <div class="empty-state" id="favEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78"/>
          </svg>
          <p>No favourites yet.<br/>Tap the heart on any station to save it.</p>
        </div>
      </section>

      <!-- Countries View -->
      <section id="countries" class="view">
        <header class="view-header">
          <h1>Browse by Country</h1>
          <p class="subtitle">Explore stations worldwide</p>
        </header>
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="countrySearchInput" placeholder="Search countries..." />
        </div>
        <div class="country-grid" id="countryGrid"></div>
      </section>

    </main>

    <!-- Player Bar -->
    <footer class="player-bar">
      <!-- Left: Mini Panel (Radio Name + Volume) -->
      <div class="mini-panel" id="miniPanel">
        <span class="mini-panel-name" id="miniPanelName">No station selected</span>
        <div class="mini-volume-control">
          <svg class="vol-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <input type="range" class="mini-volume-slider" id="miniVolumeSlider" min="0" max="100" value="75" />
        </div>
      </div>

      <!-- Center: Controls -->
      <div class="player-controls">
        <button class="btn-icon btn-play" id="playBtn" title="Play/Pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
        </button>
        <button class="btn-icon btn-fav" id="favBtn" title="Add to Favourites">♡</button>
      </div>

      <!-- Right: Status -->
      <div class="player-status" id="playerStatus">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </footer>

  </div>

  <!-- Audio Element (hidden) -->
  <audio id="audioPlayer" preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
